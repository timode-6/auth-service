databaseChangeLog:
  - changeSet:
      id: 001-create-user-credentials
      validCheckSum: 9:7bd38e6fc23d1a0cca339a64bb9afa1b
      author: timode-6
      changes:
        - createSequence:
            sequenceName: user_credentials_seq
            startValue: 1
            incrementBy: 50
        - createTable:
            tableName: user_credentials
            columns:
              - column:
                  name: id
                  type: bigint
                  defaultValueSequenceNext: user_credentials_seq
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: login
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: varchar(50)
                  defaultValue: USER
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    defaultValueComputed: CURRENT_TIMESTAMP